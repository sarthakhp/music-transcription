name: Build & Release

# Triggers:
#   - Push a version tag (e.g. git tag v1.2.0 && git push --tags)
#     → builds all platforms and publishes a GitHub Release
#   - Manual trigger from the Actions tab
#     → builds all platforms but does NOT publish a release (useful for testing)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - main
      - develop
  workflow_dispatch:

# Prevent concurrent builds on the same ref from racing
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── macOS (Apple Silicon) ─────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest          # GitHub's macos-latest is now arm64 (M1/M2)
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          path: music-transcription

      - name: Checkout viewer repo
        uses: actions/checkout@v4
        with:
          repository: sarthakhp/music-transcription-viewer
          path: music-transcription-viewer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Cache download artifacts (Python + ffmpeg)
        uses: actions/cache@v4
        with:
          path: music-transcription/packaging/_cache
          key: macos-arm64-deps-${{ hashFiles('music-transcription/requirements*.txt') }}
          restore-keys: macos-arm64-deps-

      - name: Build .app + .dmg
        run: bash packaging/macos/build.sh
        working-directory: music-transcription

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: music-transcription/packaging/_build/macos/*.dmg
          retention-days: 7

  # ── macOS (Intel) ─────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS (Intel)
    runs-on: macos-13              # macos-13 is the last Intel runner
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          path: music-transcription

      - name: Checkout viewer repo
        uses: actions/checkout@v4
        with:
          repository: sarthakhp/music-transcription-viewer
          path: music-transcription-viewer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Cache download artifacts
        uses: actions/cache@v4
        with:
          path: music-transcription/packaging/_cache
          key: macos-x86_64-deps-${{ hashFiles('music-transcription/requirements*.txt') }}
          restore-keys: macos-x86_64-deps-

      - name: Build .app + .dmg
        run: bash packaging/macos/build.sh
        working-directory: music-transcription

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: music-transcription/packaging/_build/macos/*.dmg
          retention-days: 7

  # ── Windows (x64) ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          path: music-transcription

      - name: Checkout viewer repo
        uses: actions/checkout@v4
        with:
          repository: sarthakhp/music-transcription-viewer
          path: music-transcription-viewer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Cache download artifacts
        uses: actions/cache@v4
        with:
          path: music-transcription/packaging/_cache
          key: windows-x64-deps-${{ hashFiles('music-transcription/requirements*.txt') }}
          restore-keys: windows-x64-deps-

      - name: Build installer
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\packaging\windows\build.ps1
        working-directory: music-transcription

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: music-transcription/packaging/_build/windows/*.exe
          retention-days: 7

  # ── Linux (x86_64) ────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04          # pin to 22.04 for glibc compatibility
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          path: music-transcription

      - name: Checkout viewer repo
        uses: actions/checkout@v4
        with:
          repository: sarthakhp/music-transcription-viewer
          path: music-transcription-viewer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: sudo apt-get install -y rsync

      - name: Cache download artifacts
        uses: actions/cache@v4
        with:
          path: music-transcription/packaging/_cache
          key: linux-x86_64-deps-${{ hashFiles('music-transcription/requirements*.txt') }}
          restore-keys: linux-x86_64-deps-

      # AppImage builder requires FUSE; on Ubuntu runners we use the
      # --appimage-extract-and-run flag to avoid mounting.
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/linux/build.sh
        working-directory: music-transcription

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: music-transcription/packaging/_build/linux/*.AppImage
          retention-days: 7

  # ── Publish GitHub Release ────────────────────────────────────────────────
  # Only runs on a tag push (not manual workflow_dispatch).
  # Waits for all four build jobs to succeed.
  publish-release:
    name: Publish GitHub Release
    needs:
      - build-macos-arm64
      - build-macos-intel
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write      # needed to create and upload release assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MusicTranscriber ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # e.g. v1.0.0-beta → prerelease
          body: |
            ## MusicTranscriber ${{ github.ref_name }}

            ### Download

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon M1/M2/M3) | `*-macOS-arm64.dmg` |
            | macOS (Intel) | `*-macOS-x86_64.dmg` |
            | Windows 10/11 (x64) | `*-Windows-x64-Setup.exe` |
            | Linux (x86_64) | `*.AppImage` |

            ### macOS installation note
            Right-click the app → **Open** on first launch to bypass Gatekeeper
            (expected for unsigned apps).

            ### First-run setup
            On first launch the app installs ~3-5 GB of ML libraries into
            your user data directory. This is a one-time step and takes
            10-30 minutes depending on your internet speed.
          files: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
